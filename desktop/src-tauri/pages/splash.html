<!DOCTYPE html>
<!-- Splash shown while the sidecar boots dsh AND while the WebUI's own boot
     chain settles inside the hidden main window (boot-watch.js → POST
     /_desktop/boot-settled → show_main_window; see windows.rs). The shell
     keeps this splash up until the WebUI signals boot-settled, so the user
     only ever sees ONE loading screen.

     Branding mirrors the top-left corner of https://www.deepseek.com/harness/
     (dark theme): the official DeepSeek wordmark (SVG paths extracted from
     the page) plus the raised "Harness" pill — 1px gradient border (135deg,
     rgba(255,255,255,.75)→.08→.04→.5) with a soft white glow
     (0 0 16px/32px rgba(255,255,255,.08/.04)) and a dark inner
     (rgba(0,0,0,.25), Fragment Mono 11px/500, rgba(255,255,255,.95)).

     The page's real background is an animated WebGL canvas over a flat
     rgb(10,10,10) DOM background; a static splash approximates it with a
     radial gradient sampled from the top of the page (rgb(46,78,120) →
     rgb(30,52,86) → rgb(16,22,34) → #0a0a0a). The loading ring + hint
     (rgba(255,255,255,.5), DM Sans) keep the splash informative.

     The background lives on an inner card that clips at its own
     border-radius; the <body> stays transparent so the corners show the
     desktop. This works on both platforms: WebView2 renders transparent page
     pixels over the hosting window's background (transparent(true) → tao's
     DwmEnableBlurBehindWindow backdrop). Windows disables the
     undecorated-window shadow in windows.rs create_splash (DWM would paint
     it as a 1px gray border); macOS keeps its native NSWindow shadow. A
     background on <body> would NOT work: like WKWebView, WebView2 propagates
     a root-element background over the whole rectangular canvas, ignoring
     border-radius.

     Fonts (Fragment Mono for the pill, DM Sans for the hint) are embedded as
     data: URLs — the page is served by the shell control service
     (ctl_server.rs include_str!) with no CSP, and it must render even when
     the sidecar/dsh (and their static assets) are down. -->

  html,body{height:100%;background:transparent}
  body{
    font-family:'DM Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC','PingFang SC',sans-serif;

    width:100%;height:100%;

    align-items:center;justify-content:center;
    gap:18px;
    background:radial-gradient(130% 100% at 50% 0%, rgb(46,78,120) 0%, rgb(30,52,86) 35%, rgb(16,22,34) 68%, rgb(10,10,10) 100%);

  }

    display:inline-flex;align-items:center;padding:1px;border-radius:8px;
    background:linear-gradient(135deg,rgba(255,255,255,0.75) 0%,rgba(255,255,255,0.08) 35%,rgba(255,255,255,0.04) 65%,rgba(255,255,255,0.5) 100%);

  }

    color:rgba(255,255,255,0.95);
    font-family:'Fragment Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px;font-weight:500;line-height:11px;white-space:nowrap;
  }

  .hint{font-size:12px;line-height:18px;color:rgba(255,255,255,0.5)}
  @keyframes spin{to{transform:rotate(360deg)}}
