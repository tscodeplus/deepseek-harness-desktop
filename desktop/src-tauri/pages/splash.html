<!DOCTYPE html>
<!-- Splash shown while the sidecar boots dsh — same look as the upstream
     boot loading page (packages/client/web/src/AppRoot.tsx + AppRoot.module.css):
     light neutral background, "HARNESS" wordmark, blue ring spinner. The
     WebUI's own boot page then continues the identical look once the server
     is up (wordmark → spinner → hint, so the transition is seamless).
     Loaded as a static resource via the App URL: data: URLs are unreliable
     on WKWebView (charset detection, plain-text rendering — wry dropped
     native data: URL support in 0.37). The hint is localized in-page from
     navigator.language; the stage is "starting the service", so unlike the
     upstream hint ("Loading plugins…") the label says Starting…/启动中…. -->
<html><head><meta charset="utf-8">
<script>
  // Set before the CSS applies to avoid a flash of unstyled background.
  // WebView2 paints its opaque default (white) background under a transparent
  // <body> — the rounded corners would show white. So Windows keeps the
  // background on <body> (WebView2 clips border-radius), while macOS uses the
  // inner-card variant: WKWebView propagates a root-element background over
  // the canvas, ignoring border-radius.
  document.documentElement.className = navigator.userAgent.includes('Windows') ? 'win' : '';
</script>
<style>
  /* Tokens mirror upstream AppRoot.module.css fallbacks:
     bg-base #f9fafb · label-primary #0f1115 · label-tertiary #81858c ·
     border-l2 rgb(0 0 0 / 10%) · brand-primary #3964fe. */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;
  }
  html.win body{
    height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:#f9fafb;
    border-radius:12px;overflow:hidden;
  }
  html.win .card{background:transparent;border-radius:0;overflow:visible}
  .card{
    width:100%;height:100%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:16px;
    background:#f9fafb;border-radius:12px;overflow:hidden;
  }
  .wordmark{
    font-size:16px;line-height:24px;font-weight:600;
    letter-spacing:0.08em;color:#0f1115;
  }
  .spinner{
    width:20px;height:20px;border-radius:50%;
    border:2px solid rgb(0 0 0 / 10%);
    border-top-color:#3964fe;
    animation:spin .8s linear infinite;
  }
  .hint{font-size:12px;line-height:18px;color:#81858c}
  @keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
  <div class="card">
    <div class="wordmark">HARNESS</div>
    <div class="spinner"></div>
    <div class="hint" id="hint">Starting…</div>
  </div>
  <script>
    if (navigator.language && navigator.language.toLowerCase().startsWith('zh')) {
      document.getElementById('hint').textContent = '启动中…';
    }
  </script>
</body></html>
